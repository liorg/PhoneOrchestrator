name: Sync Canary to whqueue

on:
  push:
    branches: [main]
    paths:
      - 'whqueue/canary/**'

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PhoneOrchestrator
        uses: actions/checkout@v4

      - name: Checkout whqueue
        uses: actions/checkout@v4
        with:
          repository: liorg/whqueue
          ref: main
          token: ${{ secrets.WHQUEUE_SYNC_TOKEN }}
          path: target

      - name: Sync canary folder
        run: |
          rsync -av --delete \
            --exclude='*.env' \
            whqueue/canary/ target/canary/

      - name: Commit and push
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A canary/

          if git diff --cached --quiet; then
            echo "No changes to sync"
            exit 0
          fi

          git commit -m "sync: canary from PhoneOrchestrator"
          git push origin HEAD:main