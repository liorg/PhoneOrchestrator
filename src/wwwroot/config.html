  <p class="help">
    הגדרות מערכת בזמן ריצה — ללא deploy. כל מפתח עם הסבר בעמודת "הסבר"; ההסבר נשמר ב-DB ונערך כאן.
    שורה שהשתנתה מסומנת עד שנשמרת. סודות (מפתחות API, סיסמאות) לא נשמרים כאן — רק ב-env / Swarm secrets.
  </p>
  <div class="filters">
    <input type="search" id="q" placeholder="חיפוש מפתח או הסבר">
    <button class="back" id="addKey">+ מפתח חדש</button>
  </div>
  <div id="config"><p class="empty">טוען…</p></div>
