<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canary · PhoneOrchestrator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="bar">
  <div class="bar__id">
    <span class="dot" id="pulse" aria-hidden="true"></span>
    <svg class="mark" viewBox="0 0 58 18" aria-hidden="true">
      <path d="M1 16.5 L8 2 L15 16.5 Z" fill="#A146FF" stroke="#A146FF" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="29" cy="9.5" r="7.5" fill="#2391FF"/>
      <rect x="41" y="2" width="15.5" height="15" rx="3" fill="#0FF0FF"/>
    </svg>
    <h1>Phone<em>Orchestrator</em></h1>
  </div>
  <nav class="nav">
    <a href="/">שרתים</a>
    <a href="/canary.html" aria-current="page">בדיקות</a>
  </nav>
  <button class="bar__out" id="logout">יציאה</button>
</header>

<p class="banner" id="banner" hidden></p>

<!-- ----------------------------------------------------------- runs view -->
<main class="view" id="view-runs">
  <div class="hostbar" id="proberbar"><p class="empty">טוען מצב הבודק…</p></div>

  <div class="view__head">
    <h2>סבבי בדיקה</h2>
    <div class="pager" id="runPager"></div>
  </div>

  <div class="filters">
    <label>מתאריך <input type="date" id="from"></label>
    <label>עד <input type="date" id="to"></label>
    <button class="back" id="apply">הצג</button>
    <span class="hint" id="rangeHint">ברירת מחדל: 7 ימים אחרונים</span>
  </div>

  <div id="runs"><p class="empty">טוען…</p></div>
</main>

<!-- --------------------------------------------------------- checks view -->
<main class="view" id="view-checks" hidden>
  <div class="view__head">
    <button class="back" id="backRuns">חזרה לסבבים</button>
    <div class="pager" id="checkPager"></div>
  </div>

  <div class="hostbar" id="runbar"></div>

  <div class="filters">
    <button class="chip" data-status=""        aria-current="true">הכל</button>
    <button class="chip" data-status="failed">נכשל</button>
    <button class="chip" data-status="timeout">timeout</button>
    <button class="chip" data-status="skipped">דולג</button>
    <button class="chip" data-status="passed">עבר</button>
  </div>

  <div id="checks"><p class="empty">טוען…</p></div>
</main>

<script src="canary.js"></script>
</body>
</html>
