<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PhoneOrchestrator</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0F1620">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="pwa.js" defer></script>
</head>
<body>

<header class="bar">
  <div class="bar__id">
    <span class="dot" id="pulse" aria-hidden="true"></span>
    <svg class="mark" viewBox="0 0 58 18" aria-hidden="true">
      <path d="M1 16.5 L8 2 L15 16.5 Z" fill="#A146FF" stroke="#A146FF" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="29" cy="9.5" r="7.5" fill="#2391FF"/>
      <rect x="41" y="2" width="15.5" height="15" rx="3" fill="#0FF0FF"/>
    </svg>
    <h1>Phone<em>Orchestrator</em></h1>
  </div>
  <nav class="nav" id="mainnav" aria-label="ניווט">
    <a class="nav__top" href="/" aria-current="page">שרתים</a>
    <div class="nav__grp">
      <button class="nav__top" type="button" aria-expanded="false">השכרה<span class="nav__car" aria-hidden="true"></span></button>
      <div class="nav__sub">
        <a href="/devices.html">מכשירים</a>
        <a href="/sms.html">SMS</a>
        <a href="/rentals.html">השכרות</a>
      </div>
    </div>
    <div class="nav__grp">
      <button class="nav__top" type="button" aria-expanded="false">ניהול<span class="nav__car" aria-hidden="true"></span></button>
      <div class="nav__sub">
        <a href="/customers.html">לקוחות</a>
        <a href="/unwanted.html">חסומים</a>
        <a href="/plans.html">תוכניות</a>
        <a href="/rentals.html">השכרות</a>
        <a href="/config.html">הגדרות</a>
      </div>
    </div>
    <div class="nav__grp">
      <button class="nav__top" type="button" aria-expanded="false">META<span class="nav__car" aria-hidden="true"></span></button>
      <div class="nav__sub">
        <a href="/canary.html">בדיקות</a>
        <a href="/canary-wa.html">WA canary</a>
      </div>
    </div>
  </nav>
  <div class="bar__end">
    <span class="pill" id="m-auto">—</span>
    <button class="bar__menu" type="button" aria-controls="mainnav" aria-expanded="false" aria-label="תפריט"><span aria-hidden="true">☰</span><b>שרתים</b></button>
    <button class="bar__out" id="logout">יציאה</button>
  </div>
</header>
<dl class="meta" aria-label="מצב">
  <div><dt>סריקה אחרונה</dt><dd id="m-scan">—</dd></div>
  <div><dt>סבב</dt><dd id="m-count">—</dd></div>
  <div><dt>סביבה</dt><dd id="m-env">—</dd></div>
  <div><dt>build</dt><dd id="m-marker">—</dd></div>
</dl>

<p class="banner" id="banner" hidden></p>

<!-- ---------------------------------------------------------- hosts view -->
<main class="view" id="view-hosts">
  <section class="getapp" id="getApp" hidden>
    <img class="getapp__icon" src="/icons/icon-192.png" alt="" width="52" height="52">
    <div class="getapp__txt">
      <b>אפליקציית PhoneOrchestrator</b>
      <span id="getAppHint">התקנה לטלפון או למחשב: אייקון במסך הבית, נפתחת במסך מלא בלי שורת כתובת.</span>
    </div>
    <button class="getapp__go" id="getAppBtn" type="button">הורד אפליקציה</button>
    <button class="getapp__x" id="getAppX" type="button" aria-label="הסתר">✕</button>
  </section>
  <div class="view__head">
    <h2>שרתים</h2>
    <div class="pager" id="hostPager"></div>
  </div>
  <div id="hosts" class="hosts">
    <p class="empty">טוען שרתים…</p>
  </div>
</main>

<!-- --------------------------------------------------------- phones view -->
<main class="view" id="view-phones" hidden>
  <div class="view__head">
    <button class="back" id="back">חזרה לשרתים</button>
    <div class="pager" id="phonePager"></div>
  </div>

  <div class="hostbar" id="hostbar"></div>

  <div id="phones">
    <p class="empty">טוען…</p>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
