# Swarm stack for PhoneOrchestrator.
#
# Singleton by design: replicas = 1. When the node holding it dies, Swarm
# reschedules the task onto another node, which is the failover requirement.
# Ports come from the routing mesh, so the dashboard stays reachable on the
# same address wherever the task lands.
#
# Deploy with ./deploy.sh - it sources .env, builds a timestamped tag and
# exports IMAGE. Do not run `docker stack deploy` directly: IMAGE would be
# unset and the deploy fails on an invalid reference.
#
# No default on the image line, on purpose. A registry fallback would bake a
# node address into the stack, and a :latest fallback would silently deploy a
# stale image, because Swarm does not re-pull a tag it already resolved.

version: "3.8"

services:
  orchestrator:
    image: ${IMAGE}

    environment:
      ASPNETCORE_URLS: http://+:8080
      # Double underscore maps onto the "Orchestrator" config section.
      Orchestrator__SupabaseUrl:         ${SUPABASE_URL}
      # Comes from .env via deploy.sh, so it is visible in
      # `docker service inspect`. If that matters, blank this line and create
      # a swarm secret named supabase_key instead - Program.cs prefers the
      # secret file whenever /run/secrets/supabase_key exists.
      Orchestrator__SupabaseKey:         ${SUPABASE_KEY}
      Orchestrator__HostAgentPort:       "5000"
      Orchestrator__StaleAfterSeconds:   "90"
      Orchestrator__ScanIntervalSeconds: "30"
      Orchestrator__FailuresBeforeDrain: "3"
      # Observe-only window after start. Must outlast the slowest HostAgent boot.
      Orchestrator__StartupGraceSeconds: "180"
      # Empty means take the value from bot_config['orchestrator.env'].
      Orchestrator__Env:                 ""
      # Ships observing. Flip to "true" once the dashboard looks right.
      Orchestrator__AutoDrain:           "false"

    ports:
      - target: 8080
        published: 8090
        protocol: tcp
        mode: ingress

    networks:
      - orchestrator_net

    deploy:
      replicas: 1
      # Uncomment only with more than one manager - a single-manager
      # constraint would defeat the failover this service exists for.
      # placement:
      #   constraints: [node.role == manager]
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      update_config:
        order: stop-first
        failure_action: rollback
        delay: 10s
      resources:
        limits:
          memory: 256M

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  orchestrator_net:
    driver: overlay
    attachable: true